<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PupPlay | Live Ball Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #fff;
    }
    .demo {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 120%, #1e3a8a 0%, #0f172a 55%),
        radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%);
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    /* subtle grass field */
    .demo::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 38%;
      background: linear-gradient(180deg, transparent, rgba(16,185,129,0.10));
      pointer-events: none;
      z-index: 2;
    }

    /* Background videos (dogs & cats playing) */
    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.6s ease;
      pointer-events: none;
      filter: saturate(1.05) brightness(0.92);
    }
    .bg-video.show { opacity: 1; }
    .bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 120%, rgba(15,23,42,0.45), rgba(15,23,42,0.82) 72%),
        linear-gradient(180deg, rgba(15,23,42,0.55), rgba(15,23,42,0.25) 40%, rgba(15,23,42,0.7));
      transition: opacity 0.4s ease;
    }
    .bg-overlay.off { opacity: 0; }

    /* Top controls */
    .controls {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(15,23,42,0.72);
      border: 1px solid rgba(148,163,184,0.25);
      backdrop-filter: blur(10px);
      padding: 8px;
      border-radius: 14px;
      z-index: 30;
      max-width: 96vw;
    }
    .controls a, .controls button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(255,255,255,0.06);
      color: #e2e8f0;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .controls a:hover, .controls button:hover { background: rgba(255,255,255,0.14); }
    .controls button:active, .controls a:active { transform: scale(0.96); }
    .controls .primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .controls .primary:hover { background: #1d4ed8; }
    .controls .active { background: #10b981; border-color: #10b981; color: #06281c; }

    /* Title / hint */
    .hint {
      position: absolute;
      top: 84px; left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #cbd5e1;
      font-size: 0.95rem;
      font-weight: 600;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.6s;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      width: 90vw;
    }
    .hint .big { display: block; font-size: 1.35rem; color: #fff; margin-bottom: 4px; }
    .hint.hide { opacity: 0; }

    /* Launcher box */
    .launcher {
      position: absolute;
      left: 50%; bottom: 4%;
      transform: translateX(-50%);
      width: 150px; height: 150px;
      border-radius: 50%;
      border: 6px solid #334155;
      background: radial-gradient(circle at 50% 40%, #1e293b, #0b1220);
      box-shadow: 0 0 40px rgba(37,99,235,0.25), inset 0 0 30px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .launcher::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 2px dashed rgba(34,211,238,0.35);
    }
    .launcher .label {
      position: absolute;
      bottom: -26px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #64748b;
      white-space: nowrap;
    }

    /* The ball */
    .ball {
      position: absolute;
      top: 0; left: 0;
      width: 84px; height: 84px;
      border-radius: 50%;
      cursor: grab;
      touch-action: none;
      will-change: transform;
      z-index: 15;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.45));
    }
    .ball.grabbing { cursor: grabbing; }
    .ball svg { width: 100%; height: 100%; display: block; pointer-events: none; }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.25);
      color: #e2e8f0;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 40;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 560px) {
      .controls { gap: 6px; padding: 6px; }
      .controls a, .controls button { font-size: 0.78rem; padding: 8px 10px; }
      .hint { top: 96px; }
      .hint .big { font-size: 1.1rem; }
      .ball { width: 68px; height: 68px; }
      .launcher { width: 120px; height: 120px; }
    }
  </style>
</head>
<body>
  <div class="demo" id="demo">
    <video class="bg-video show" id="bgvid1" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true">
      <source src="/assets/dog-playing.mp4" type="video/mp4">
    </video>
    <video class="bg-video" id="bgvid2" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true">
      <source src="/assets/cat-playing.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay" id="bg-overlay"></div>

    <div class="controls">
      <a href="/" title="Back to shop">&larr; Shop</a>
      <button id="fullscreen-btn" class="primary" title="Go full screen">&#9974; Fullscreen</button>
      <button id="auto-btn" title="Auto-launch like the real product">Auto Launch: Off</button>
      <button id="video-btn" class="active" title="Toggle background video">Video: On</button>
      <button id="reset-btn" title="Reset the ball">Reset</button>
    </div>

    <div class="hint" id="hint">
      <span class="big">Drag the ball &mdash; fling it around!</span>
      Tap and drag with a paw or finger. Release to throw it.
    </div>

    <div class="launcher" id="launcher">
      <span class="label">PupPlay Launcher</span>
    </div>

    <div class="ball" id="ball" role="button" aria-label="Draggable ball" tabindex="0">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="ballGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#fff9c4"/>
            <stop offset="45%" stop-color="#fbe13b"/>
            <stop offset="100%" stop-color="#c99a0b"/>
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="48" fill="url(#ballGrad)"/>
        <path d="M6,38 Q50,50 6,62" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
        <path d="M94,38 Q50,50 94,62" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
        <circle cx="36" cy="30" r="9" fill="#ffffff" opacity="0.28"/>
      </svg>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    (function () {
      const demo = document.getElementById('demo');
      const ball = document.getElementById('ball');
      const hint = document.getElementById('hint');
      const toastEl = document.getElementById('toast');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      const autoBtn = document.getElementById('auto-btn');
      const resetBtn = document.getElementById('reset-btn');
      const videoBtn = document.getElementById('video-btn');
      const bgOverlay = document.getElementById('bg-overlay');
      const bgVids = [document.getElementById('bgvid1'), document.getElementById('bgvid2')];

      let W = 0, H = 0, SIZE = 84;
      let x = 0, y = 0, vx = 0, vy = 0;
      let dragging = false, pointerId = null, offsetX = 0, offsetY = 0;
      let lastX = 0, lastY = 0, lastT = 0;
      let autoOn = false, autoTimer = null;

      const FRICTION = 0.988;
      const RESTITUTION = 0.82;
      const STOP = 0.06;

      function measure() {
        const r = demo.getBoundingClientRect();
        W = r.width; H = r.height;
        SIZE = ball.offsetWidth;
        // keep ball inside after resize
        x = Math.max(0, Math.min(W - SIZE, x));
        y = Math.max(0, Math.min(H - SIZE, y));
        ball.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      }

      function centerBall() {
        x = (W - SIZE) / 2;
        y = (H - SIZE) / 2;
        vx = vy = 0;
        ball.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
      }

      function launchBall() {
        if (dragging) return;
        const angle = Math.random() * Math.PI * 2;
        const speed = 11 + Math.random() * 9;
        vx = Math.cos(angle) * speed;
        vy = Math.sin(angle) * speed;
        showToast('Ball launched!');
      }

      // --- Drag handling (pointer = mouse + touch + pen) ---
      ball.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        dragging = true;
        pointerId = e.pointerId;
        try { ball.setPointerCapture(pointerId); } catch (err) {}
        const r = demo.getBoundingClientRect();
        const px = e.clientX - r.left;
        const py = e.clientY - r.top;
        offsetX = px - x;
        offsetY = py - y;
        lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
        vx = vy = 0;
        ball.classList.add('grabbing');
        hint.classList.add('hide');
      });

      window.addEventListener('pointermove', function (e) {
        if (!dragging || e.pointerId !== pointerId) return;
        const r = demo.getBoundingClientRect();
        const px = e.clientX - r.left;
        const py = e.clientY - r.top;
        let nx = px - offsetX;
        let ny = py - offsetY;
        nx = Math.max(0, Math.min(W - SIZE, nx));
        ny = Math.max(0, Math.min(H - SIZE, ny));
        const now = performance.now();
        const dt = Math.max(now - lastT, 1);
        vx = ((e.clientX - lastX) / dt) * 16;
        vy = ((e.clientY - lastY) / dt) * 16;
        lastX = e.clientX; lastY = e.clientY; lastT = now;
        x = nx; y = ny;
        ball.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      }, { passive: false });

      function endDrag(e) {
        if (e.pointerId !== pointerId) return;
        dragging = false;
        pointerId = null;
        ball.classList.remove('grabbing');
      }
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);

      // --- Animation loop ---
      function tick() {
        if (!dragging) {
          x += vx;
          y += vy;
          vx *= FRICTION;
          vy *= FRICTION;

          if (x < 0) { x = 0; vx = -vx * RESTITUTION; }
          if (x + SIZE > W) { x = W - SIZE; vx = -vx * RESTITUTION; }
          if (y < 0) { y = 0; vy = -vy * RESTITUTION; }
          if (y + SIZE > H) { y = H - SIZE; vy = -vy * RESTITUTION; }

          if (Math.abs(vx) < STOP) vx = 0;
          if (Math.abs(vy) < STOP) vy = 0;

          if (vx !== 0 || vy !== 0) {
            ball.style.transform = 'translate(' + x + 'px,' + y + 'px)';
          }
        }
        requestAnimationFrame(tick);
      }

      // --- Fullscreen ---
      function toggleFullscreen() {
        const el = demo;
        if (!document.fullscreenElement) {
          const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (req) {
            Promise.resolve(req.call(el)).then(function () {
              fullscreenBtn.innerHTML = '&#10005; Exit Fullscreen';
            }).catch(function () {
              showToast('Fullscreen not available');
            });
          } else {
            showToast('Fullscreen not supported here');
          }
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
          if (exit) exit.call(document);
        }
      }
      document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement) {
          fullscreenBtn.innerHTML = '&#9974; Fullscreen';
        }
        setTimeout(measure, 100);
      });
      fullscreenBtn.addEventListener('click', toggleFullscreen);

      // --- Auto launch ---
      function setAuto(on) {
        autoOn = on;
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        if (on) {
          autoBtn.textContent = 'Auto Launch: On';
          autoBtn.classList.add('active');
          launchBall();
          autoTimer = setInterval(launchBall, 4000);
          showToast('Auto launch on');
        } else {
          autoBtn.textContent = 'Auto Launch: Off';
          autoBtn.classList.remove('active');
        }
      }
      autoBtn.addEventListener('click', function () { setAuto(!autoOn); });

      // --- Background videos (dogs & cats playing) ---
      let bgIndex = 0;
      let videoOn = true;
      bgVids.forEach(function (v) { v.muted = true; });
      function tryPlayBg() {
        bgVids.forEach(function (v) {
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
        });
      }
      tryPlayBg();
      setInterval(function () {
        if (!videoOn) return;
        bgVids[bgIndex].classList.remove('show');
        bgIndex = (bgIndex + 1) % bgVids.length;
        bgVids[bgIndex].classList.add('show');
      }, 9000);
      videoBtn.addEventListener('click', function () {
        videoOn = !videoOn;
        if (videoOn) {
          tryPlayBg();
          bgOverlay.classList.remove('off');
          bgVids[bgIndex].classList.add('show');
          videoBtn.textContent = 'Video: On';
          videoBtn.classList.add('active');
        } else {
          bgVids.forEach(function (v) { v.pause(); v.classList.remove('show'); });
          bgOverlay.classList.add('off');
          videoBtn.textContent = 'Video: Off';
          videoBtn.classList.remove('active');
        }
      });

      // --- Reset ---
      resetBtn.addEventListener('click', function () {
        setAuto(false);
        centerBall();
        hint.classList.remove('hide');
        showToast('Ball reset');
      });

      // --- Init ---
      function init() {
        measure();
        centerBall();
        requestAnimationFrame(tick);
      }
      window.addEventListener('resize', measure);
      window.addEventListener('orientationchange', function () { setTimeout(measure, 200); });

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
      } else {
        window.addEventListener('DOMContentLoaded', init);
      }
      window.addEventListener('load', function () { setTimeout(measure, 50); });
    })();
  </script>
</body>
</html>
